services:
  - type: web
    name: proposalcraft-agent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: qwen/qwen3.8-27b
      - key: COMPANY_NAME
        value: ProposalCraft Solutions
      - key: DEFAULT_CURRENCY
        value: USD
