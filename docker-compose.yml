version: "3.8"

services:
  proposalcraft-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proposalcraft-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_CHAT_MODEL=${GROQ_CHAT_MODEL:-qwen/qwen3.8-27b}
      - COMPANY_NAME=${COMPANY_NAME:-ProposalCraft Solutions}
      - DEFAULT_CURRENCY=${DEFAULT_CURRENCY:-USD}
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
